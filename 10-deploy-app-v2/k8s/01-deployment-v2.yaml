apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-demo
  namespace: sre-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-demo
  template:
    metadata:
      labels:
        app: sre-demo
    spec:
      containers:
        - name: app
          image: alanmosilva/sre-demo:v2
          imagePullPolicy: Always
          env:
            - name: OTEL_SERVICE_NAME
              value: sre-demo
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://otel-collector.otel.svc.cluster.local:4318/v1/traces
            - name: DEPLOYMENT_ENVIRONMENT
              value: lab
            - name: K8S_NAMESPACE
              value: sre-lab
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
            limits:
              memory: 256Mi
